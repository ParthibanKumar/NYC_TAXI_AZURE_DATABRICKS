<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"><title>NYC Taxi Lakehouse architecture</title><desc>Data flows from NYC TLC parquet files through Azure Data Factory into ADLS Gen2, is transformed by Azure Databricks into Bronze, Silver and Gold Delta tables, and served to analytics tools, with Unity Catalog governing access.</desc>
